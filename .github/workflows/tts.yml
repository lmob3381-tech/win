name: Serverless AI Voice Generator (Edge-TTS)

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Teks narasi atau kata-kata yang akan dikonversi menjadi suara"
        required: true
        type: string
      voice:
        description: "Kode model suara neural Edge-TTS"
        required: false
        default: "id-ID-ArdiNeural"
        type: string
      filename:
        description: "Nama file output tanpa ekstensi .mp3"
        required: false
        default: "output_audio"
        type: string

permissions:
  contents: read

jobs:
  render-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Edge-TTS Neural Engine
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Render High-Quality Neural MP3
        env:
          TTS_TEXT: ${{ inputs.text }}
          TTS_VOICE: ${{ inputs.voice }}
          TTS_FILENAME: ${{ inputs.filename }}
        run: |
          python - << 'EOF'
          import asyncio
          import os
          import re
          import sys
          import edge_tts

          text = os.environ.get("TTS_TEXT", "").strip()
          voice = os.environ.get("TTS_VOICE", "id-ID-ArdiNeural").strip() or "id-ID-ArdiNeural"
          raw_filename = os.environ.get("TTS_FILENAME", "output_audio").strip() or "output_audio"

          if raw_filename.lower().endswith(".mp3"):
              raw_filename = raw_filename[:-4].strip()

          safe_filename = re.sub(r'[\\/*?:"<>|]+', "_", raw_filename)
          safe_filename = re.sub(r"\s+", "_", safe_filename) or "output_audio"
          output_path = f"{safe_filename}.mp3"

          if not text:
              print("Error: Parameter 'text' kosong.", file=sys.stderr)
              sys.exit(1)

          async def synthesize() -> None:
              communicate = edge_tts.Communicate(text=text, voice=voice)
              await communicate.save(output_path)

          asyncio.run(synthesize())

          if not os.path.isfile(output_path) or os.path.getsize(output_path) == 0:
              print("Error: File MP3 gagal dibuat atau berukuran 0 byte.", file=sys.stderr)
              sys.exit(1)

          print(f"Berhasil merender: {output_path} ({os.path.getsize(output_path)} bytes) dengan suara {voice}")
          EOF

      - name: Upload MP3 to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-audio
          path: "*.mp3"
          retention-days: 1
          if-no-files-found: error
