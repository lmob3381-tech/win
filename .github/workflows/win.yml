name: Windows Remote Desktop (noVNC via Cloudflare Quick Tunnel)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'Password VNC (max 8 karakter)'
        required: true
        default: 'ganti123'

jobs:
  windows-vnc:
    runs-on: windows-2022
    timeout-minutes: 350   # ~6 jam, batas maksimal GitHub-hosted runner

    steps:
      - name: Install TightVNC Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi" -OutFile "tightvnc.msi"
          Start-Process msiexec.exe -ArgumentList "/i tightvnc.msi /quiet /norestart ADDLOCAL=Server SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=${{ github.event.inputs.vnc_password }} SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1" -Wait
          Start-Sleep -Seconds 5

          # Pastikan AllowLoopback benar-benar ke-set di registry (kadang MSI property tidak konsisten diterapkan)
          $regPath = "HKLM:\SOFTWARE\TightVNC\Server"
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          Set-ItemProperty -Path $regPath -Name "AllowLoopback" -Value 1 -Type DWord -Force

          Restart-Service -Name "tvnserver" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Get-Service -Name "tvnserver" | Start-Service -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          Write-Host "TightVNC service jalan di port 5900, loopback connections: enabled"
          Write-Host "Cek nilai registry AllowLoopback:"
          Get-ItemProperty -Path $regPath -Name "AllowLoopback" -ErrorAction SilentlyContinue

      - name: Install Python (buat jalanin noVNC/websockify)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download noVNC
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" -OutFile "novnc.zip"
          Expand-Archive -Path "novnc.zip" -DestinationPath "." -Force
          Rename-Item -Path "noVNC-master" -NewName "noVNC"

      - name: Install websockify
        shell: powershell
        run: |
          pip install websockify

      - name: Download cloudflared
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Start websockify + cloudflared + tampilkan link + keep alive (satu step menyatu)
        shell: powershell
        run: |
          # PENTING: kedua proses ini dijalankan sebagai Job DI DALAM STEP YANG SAMA,
          # supaya keduanya tetap hidup selama step ini (dan loop keep-alive di baliknya) berjalan.
          # Kalau dipisah antar-step, job akan mati saat step-nya selesai.

          $wsJob = Start-Job -ScriptBlock {
            Set-Location $using:PWD
            websockify --web noVNC 6080 localhost:5900 2>&1 | Out-File -FilePath "websockify_full.log" -Encoding utf8
          }

          Write-Host "Menunggu websockify listening di port 6080..."
          $wsReady = $false
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            $test = Test-NetConnection -ComputerName localhost -Port 6080 -WarningAction SilentlyContinue
            if ($test.TcpTestSucceeded) { $wsReady = $true; break }
          }

          if (-not $wsReady) {
            Write-Host "GAGAL: websockify tidak listening di port 6080. Log:"
            Get-Content "websockify_full.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "websockify siap di port 6080."

          $cfJob = Start-Job -ScriptBlock {
            Set-Location $using:PWD
            & ".\cloudflared.exe" tunnel --url http://localhost:6080 2>&1 | Out-File -FilePath "cf_full.log" -Encoding utf8
          }

          Write-Host "Menunggu cloudflared connect..."
          $foundUrl = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "cf_full.log") {
              $content = Get-Content "cf_full.log" -Raw -ErrorAction SilentlyContinue
              if ($content -match "https://[a-zA-Z0-9\-]+\.trycloudflare\.com") {
                $foundUrl = $matches[0]
                break
              }
            }
          }

          Write-Host "=================================================="
          if ($foundUrl) {
            Write-Host " BUKA LINK INI DI CHROME ANDROID:"
            Write-Host " $foundUrl/vnc.html?autoconnect=true&password=${{ github.event.inputs.vnc_password }}"
          } else {
            Write-Host " URL belum ketemu setelah 60 detik. Cek full log di bawah:"
            Get-Content "cf_full.log" -ErrorAction SilentlyContinue
          }
          Write-Host " Password VNC: ${{ github.event.inputs.vnc_password }}"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Kedua proses tetap hidup selama step ini berjalan (loop keep-alive di bawah)."
          Write-Host "Jangan cancel workflow selama masih mau dipakai."
          Write-Host ""

          $endTime = (Get-Date).AddMinutes(335)
          while ((Get-Date) -lt $endTime) {
            Start-Sleep -Seconds 30
            $wsState = (Get-Job -Id $wsJob.Id).State
            $cfState = (Get-Job -Id $cfJob.Id).State
            if ($wsState -ne "Running" -or $cfState -ne "Running") {
              Write-Host "PERINGATAN: salah satu proses berhenti. websockify=$wsState, cloudflared=$cfState"
              Write-Host "--- log websockify ---"
              Get-Content "websockify_full.log" -Tail 20 -ErrorAction SilentlyContinue
              Write-Host "--- log cloudflared ---"
              Get-Content "cf_full.log" -Tail 20 -ErrorAction SilentlyContinue
              break
            }
            Write-Host "Masih hidup... $(Get-Date) | websockify=$wsState cloudflared=$cfState"
          }
          
