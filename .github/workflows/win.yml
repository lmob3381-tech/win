name: Windows noVNC via Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Berapa lama sesi dibuka (menit), max ~350 (limit job 6 jam)"
        required: false
        default: "280"

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Set VNC password
        shell: powershell
        run: |
          $env:VNC_PASSWORD = "antigravity123"
          echo "VNC_PASSWORD=antigravity123" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 1. Install TightVNC server (ringan, cocok utk Windows Server core)
      # ---------------------------------------------------------
      - name: Install TightVNC
        shell: powershell
        run: |
          Write-Host "Downloading TightVNC..."
          Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi" -OutFile "$env:TEMP\tightvnc.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tightvnc.msi`" /quiet /norestart ADDLOCAL=Server SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$env:VNC_PASSWORD SET_USECONTROLAUTHENTICATION=1 VALUE_OF_USECONTROLAUTHENTICATION=1" -Wait
          Start-Sleep -Seconds 5
          Restart-Service tvnserver -ErrorAction SilentlyContinue
          Write-Host "TightVNC installed."

      # ---------------------------------------------------------
      # 2. Install noVNC + websockify (jembatan VNC -> browser via WebSocket)
      # ---------------------------------------------------------
      - name: Setup Python & noVNC
        shell: powershell
        run: |
          choco install python -y --no-progress
          refreshenv
          pip install websockify

          git clone --depth 1 https://github.com/novnc/noVNC.git "$env:TEMP\noVNC"

      - name: Start websockify (noVNC bridge)
        shell: powershell
        run: |
          Start-Process -FilePath "python" -ArgumentList "-m websockify --web `"$env:TEMP\noVNC`" 6080 localhost:5900" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          Write-Host "noVNC bridge running on port 6080"

      # ---------------------------------------------------------
      # 3. Cloudflared quick tunnel (TANPA akun/login) ke noVNC
      # ---------------------------------------------------------
      - name: Install cloudflared
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$env:TEMP\cloudflared.exe"

      - name: Start Cloudflare quick tunnel
        shell: powershell
        run: |
          $log = "$env:TEMP\cloudflared.log"
          Start-Process -FilePath "$env:TEMP\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:6080 --logfile `"$log`"" -WindowStyle Hidden
          Start-Sleep -Seconds 12

          $found = $false
          for ($i = 0; $i -lt 10; $i++) {
            if (Test-Path $log) {
              $content = Get-Content $log -Raw
              if ($content -match "https://[a-zA-Z0-9\-]+\.trycloudflare\.com") {
                $url = $Matches[0]
                Write-Host "=================================================="
                Write-Host " NOVNC URL: $url/vnc.html?password=$env:VNC_PASSWORD"
                Write-Host "=================================================="
                $found = $true
                break
              }
            }
            Start-Sleep -Seconds 3
          }
          if (-not $found) {
            Write-Host "Tunnel URL belum ketemu, cek cloudflared.log manual di artifact."
          }

      - name: Upload cloudflared log (buat cari URL kalau ketinggalan)
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-log
          path: C:\Users\runneradmin\AppData\Local\Temp\cloudflared.log
        continue-on-error: true

      # ---------------------------------------------------------
      # 4. Tahan sesi tetap hidup selama durasi yang diminta
      # ---------------------------------------------------------
      - name: Keep session alive
        shell: powershell
        run: |
          $minutes = [int]"${{ github.event.inputs.duration_minutes }}"
          if ($minutes -le 0) { $minutes = 180 }
          Write-Host "Sesi akan bertahan $minutes menit. Buka URL noVNC dari log step sebelumnya."
          Start-Sleep -Seconds ($minutes * 60)
          
