name: Windows Remote Desktop (VNC via ngrok)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'Password VNC (max 8 karakter)'
        required: true
        default: 'ganti123'

jobs:
  windows-vnc:
    runs-on: windows-2022
    timeout-minutes: 350   # ~6 jam, batas maksimal GitHub-hosted runner

    steps:
      - name: Install TightVNC Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi" -OutFile "tightvnc.msi"
          Start-Process msiexec.exe -ArgumentList "/i tightvnc.msi /quiet /norestart ADDLOCAL=Server SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=${{ github.event.inputs.vnc_password }}" -Wait
          Start-Sleep -Seconds 5
          Get-Service -Name "tvnserver" | Start-Service
          Write-Host "TightVNC service jalan di port 5900"

      - name: Download & setup ngrok
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force
          .\ngrok.exe config add-authtoken 2mTSjcO07iCjjNJvngly1gjUwGY_4sCqrhPGwjrcY4QM5qTfN

      - name: Start ngrok TCP tunnel
        shell: powershell
        run: |
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp", "5900", "--log=stdout", "--log-format=json" `
            -RedirectStandardOutput "ngrok.log" -NoNewWindow
          Start-Sleep -Seconds 8

      - name: Tampilkan alamat tunnel (host:port buat RealVNC)
        shell: powershell
        run: |
          $maxTries = 10
          for ($i = 0; $i -lt $maxTries; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
              $publicUrl = $resp.tunnels[0].public_url
              Write-Host "=================================================="
              Write-Host " ALAMAT VNC (masukkan ke RealVNC Viewer Android):"
              Write-Host " $($publicUrl -replace 'tcp://','')"
              Write-Host " Password: ${{ github.event.inputs.vnc_password }}"
              Write-Host "=================================================="
              break
            } catch {
              Start-Sleep -Seconds 3
            }
          }

      - name: Keep alive (jaga koneksi tetap hidup)
        shell: powershell
        run: |
          $endTime = (Get-Date).AddMinutes(340)
          while ((Get-Date) -lt $endTime) {
            Start-Sleep -Seconds 60
            Write-Host "Masih hidup... $(Get-Date)"
          }
          
