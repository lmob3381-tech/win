name: Windows Remote Desktop (noVNC via Cloudflare Quick Tunnel)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'Password VNC (max 8 karakter)'
        required: true
        default: 'ganti123'

jobs:
  windows-vnc:
    runs-on: windows-2022
    timeout-minutes: 350   # ~6 jam, batas maksimal GitHub-hosted runner

    steps:
      - name: Install TightVNC Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi" -OutFile "tightvnc.msi"
          Start-Process msiexec.exe -ArgumentList "/i tightvnc.msi /quiet /norestart ADDLOCAL=Server SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=${{ github.event.inputs.vnc_password }}" -Wait
          Start-Sleep -Seconds 5
          Get-Service -Name "tvnserver" | Start-Service
          Write-Host "TightVNC service jalan di port 5900"

      - name: Install Python (buat jalanin noVNC/websockify)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download noVNC
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" -OutFile "novnc.zip"
          Expand-Archive -Path "novnc.zip" -DestinationPath "." -Force
          Rename-Item -Path "noVNC-master" -NewName "noVNC"

      - name: Install websockify
        shell: powershell
        run: |
          pip install websockify

      - name: Start websockify (jembatan VNC ke WebSocket/HTTP di port 6080)
        shell: powershell
        run: |
          Start-Process -FilePath "websockify" `
            -ArgumentList "--web", "noVNC", "6080", "localhost:5900" `
            -RedirectStandardOutput "websockify_out.log" -RedirectStandardError "websockify_err.log" -NoNewWindow
          Start-Sleep -Seconds 5
          Write-Host "websockify + noVNC jalan di port 6080"

      - name: Download cloudflared
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Start Cloudflare Quick Tunnel (tanpa akun)
        shell: powershell
        run: |
          Start-Process -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel", "--url", "http://localhost:6080" `
            -RedirectStandardOutput "cf_out.log" -RedirectStandardError "cf_err.log" -NoNewWindow
          Start-Sleep -Seconds 15

      - name: Tampilkan link akses
        shell: powershell
        run: |
          $logContent = Get-Content "cf_err.log" -ErrorAction SilentlyContinue
          $urlLine = $logContent | Select-String -Pattern "https://.*\.trycloudflare\.com"
          Write-Host "=================================================="
          Write-Host " BUKA LINK INI DI CHROME ANDROID:"
          if ($urlLine) {
            $url = ($urlLine -split '\s+') | Where-Object { $_ -match "https://.*trycloudflare\.com" } | Select-Object -First 1
            Write-Host " $url/vnc.html?autoconnect=true&password=${{ github.event.inputs.vnc_password }}"
          } else {
            Write-Host " (URL belum ketemu, lihat full log di bawah)"
          }
          Write-Host " Password VNC: ${{ github.event.inputs.vnc_password }}"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "=== FULL LOG CLOUDFLARED (kalau URL di atas kosong, cari manual di sini) ==="
          Get-Content "cf_err.log" -ErrorAction SilentlyContinue

      - name: Keep alive (jaga koneksi tetap hidup)
        shell: powershell
        run: |
          $endTime = (Get-Date).AddMinutes(340)
          while ((Get-Date) -lt $endTime) {
            Start-Sleep -Seconds 60
            Write-Host "Masih hidup... $(Get-Date)"
          }
          
